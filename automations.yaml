- id: '1776194440648'
  alias: Reset Vacuum Active Job
  description: Reset the dashboard vacuum room lock when the vacuum finishes cleaning
    and becomes idle or docked.
  triggers:
  - platform: state
    entity_id: vacuum.xiaomi_de_1171929617_ov51gl
    to: idle
  - platform: state
    entity_id: vacuum.xiaomi_de_1171929617_ov51gl
    to: docked
  conditions:
  - condition: not
    conditions:
    - condition: state
      entity_id: input_select.vacuum_active_job
      state: idle
  actions:
  - target:
      entity_id: input_select.vacuum_active_job
    data:
      option: idle
    action: input_select.select_option
  mode: single
- id: '1778184090465'
  alias: BILRESA dual button controls desk plug
  description: Use single press on BILRESA dual button to control the desk smart plug.
    Button 1 turns the plug on, button 2 turns it off.
  triggers:
  - platform: state
    entity_id: event.bilresa_dual_button_button_1
    id: button_1
  - platform: state
    entity_id: event.bilresa_dual_button_button_2
    id: button_2
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: button_1
      - condition: state
        entity_id: event.bilresa_dual_button_button_1
        attribute: event_type
        state: multi_press_1
      sequence:
      - target:
          entity_id: switch.grillplats_plug
        action: switch.turn_on
    - conditions:
      - condition: trigger
        id: button_2
      - condition: state
        entity_id: event.bilresa_dual_button_button_2
        attribute: event_type
        state: multi_press_1
      sequence:
      - target:
          entity_id: switch.grillplats_plug
        action: switch.turn_off
  mode: single
- id: '1788199327859'
  alias: Recover OpenThread Border Router
  description: Refreshes Supervisor's cached OTBR running state every two minutes
    and starts the app when stopped. Rechecks after each start attempt so temporary
    USB RCP disappearance does not defeat recovery.
  triggers:
  - trigger: state
    entity_id: binary_sensor.openthread_border_router_running
    to: 'off'
    for:
      seconds: 15
    id: stopped
  - trigger: time_pattern
    minutes: /2
    id: retry
  conditions: []
  actions:
  - action: homeassistant.update_entity
    target:
      entity_id: binary_sensor.openthread_border_router_running
    continue_on_error: true
  - delay:
      seconds: 12
  - condition: state
    entity_id: binary_sensor.openthread_border_router_running
    state: 'off'
  - action: hassio.app_start
    data:
      app: core_openthread_border_router
    continue_on_error: true
  - delay:
      seconds: 20
  - action: homeassistant.update_entity
    target:
      entity_id: binary_sensor.openthread_border_router_running
    continue_on_error: true
  mode: single
