vacuum_mala_kimnata_sweep:
  alias: Мала кімната Sweep
  sequence:
  - action: input_select.select_option
    target:
      entity_id: input_select.vacuum_active_job
    data:
      option: mala_sweep
  - action: select.select_option
    target:
      entity_id: select.xiaomi_de_1171929617_ov51gl_sweep_mop_type_p_2_4
    data:
      option: Vacuuming
  - action: notify.send_message
    target:
      entity_id: notify.xiaomi_de_1171929617_ov51gl_start_vacuum_room_sweep_a_2_16
    data:
      message: '4'
